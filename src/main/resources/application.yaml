server:
  port: 8080

spring:
  application:
    name: agentic-rag

# LLM 配置（OpenAI 兼容接口）
# API Key 用环境变量注入：export LLM_API_KEY=sk-xxx
llm:
  # OpenAI 兼容 base-url，示例：
  #   硅基流动:  https://api.siliconflow.cn/v1
  #   阿里云百炼: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   OpenAI:    https://api.openai.com/v1
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY:}
  # 模型名需与供应商匹配，示例：Qwen/Qwen2.5-72B-Instruct（硅基流动）/ qwen-plus（百炼）
  model: ${LLM_MODEL:Qwen/Qwen2.5-72B-Instruct}
  timeout-seconds: 60
  max-agent-rounds: 5
  memory-rounds: 10

logging:
  level:
    com.agenticrag: info
